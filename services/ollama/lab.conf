[Service]
Environment="OLLAMA_HOST=127.0.0.1:11434"
Environment="OLLAMA_NO_CLOUD=1"
Environment="OLLAMA_CONTEXT_LENGTH=1024"
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_MAX_QUEUE=1"
Environment="OLLAMA_KEEP_ALIVE=2m"
Environment="CUDA_VISIBLE_DEVICES=-1"
Environment="ROCR_VISIBLE_DEVICES=-1"
MemoryHigh=1700M
MemoryMax=1900M
MemorySwapMax=0
CPUQuota=200%
NoNewPrivileges=true
PrivateTmp=true
PrivateDevices=true
ProtectHome=true
ProtectSystem=strict
ReadWritePaths=/usr/share/ollama
InaccessiblePaths=-/usr/bin/ssh -/usr/bin/scp -/usr/bin/sftp -/usr/bin/git -/usr/bin/terraform -/usr/local/bin/terraform
CapabilityBoundingSet=
UMask=0077
