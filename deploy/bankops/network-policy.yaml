apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bankops-web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bankops-web
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 3000
  egress: []
