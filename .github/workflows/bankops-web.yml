name: bankops-web
on:
  push:
    branches: [main]
    paths: ["apps/bankops-web/**", ".github/workflows/bankops-web.yml"]
  pull_request:
    paths: ["apps/bankops-web/**", ".github/workflows/bankops-web.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bankops-web-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/atasenkeremdev/bankops-web
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/bankops-web/package-lock.json
      - name: Install and check TypeScript
        working-directory: apps/bankops-web
        run: npm ci --ignore-scripts && npm run typecheck
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: apps/bankops-web
          platforms: linux/amd64
          load: true
          tags: ghcr.io/atasenkeremdev/bankops-web:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/atasenkeremdev/enterprise-platform-lab
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run constrained production container
        run: |
          docker run -d --name bankops-web --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --memory=256m --cpus=1 --tmpfs /tmp:rw,uid=1001,gid=1001,mode=1777 \
            --tmpfs /app/.next/cache:rw,uid=1001,gid=1001,mode=1777 \
            -p 127.0.0.1:3000:3000 "$IMAGE:sha-$GITHUB_SHA"
          for attempt in $(seq 1 30); do
            echo "Readiness attempt $attempt"
            if curl -fsS http://127.0.0.1:3000/healthz; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/healthz
          test "$(docker inspect --format '{{.Config.User}}' bankops-web)" = "1001:1001"
      - name: Browser validation
        working-directory: apps/bankops-web
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Verify container health
        run: |
          for attempt in $(seq 1 20); do
            echo "Healthcheck attempt $attempt"
            test "$(docker inspect --format '{{.State.Health.Status}}' bankops-web)" = healthy && exit 0
            sleep 2
          done
          docker logs bankops-web
          exit 1
      - name: Login to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish validated image
        id: publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE:sha-$GITHUB_SHA"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$GITHUB_SHA")
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          echo "Published $reference" >> "$GITHUB_STEP_SUMMARY"
          docker image inspect --format 'Image bytes: {{.Size}}' "$IMAGE:sha-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit deployment digest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_IMAGE: ${{ steps.publish.outputs.reference }}
        run: |
          # A fresh checkout preserves unrelated commits made while the image built.
          git -c credential.helper='!gh auth git-credential' fetch origin main
          git checkout -B deployment-update origin/main
          python3 - <<'PYTHON'
          import os,re
          from pathlib import Path
          p=Path('deploy/bankops/deployment.yaml')
          text=p.read_text()
          text=re.sub(r'image: ghcr.io/atasenkeremdev/bankops-web:[^\s]+|image: ghcr.io/atasenkeremdev/bankops-web@sha256:[a-f0-9]+','image: '+os.environ['PUBLISHED_IMAGE'],text)
          p.write_text(text)
          PYTHON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/bankops/deployment.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Deploy bankops-web image from ${GITHUB_SHA:0:12}"
          git -c credential.helper='!gh auth git-credential' push origin HEAD:main
      - name: Container logs
        if: failure()
        run: docker logs bankops-web || true
