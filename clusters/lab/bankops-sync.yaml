apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bankops-web
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 3m
  path: ./deploy/bankops
  prune: true
  serviceAccountName: bankops-reconciler
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: bankops-web
      namespace: bankops
