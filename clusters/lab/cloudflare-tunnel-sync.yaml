apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflare-tunnel
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 3m
  path: ./deploy/cloudflare-tunnel
  prune: true
  serviceAccountName: cloudflare-tunnel-reconciler
  dependsOn:
    - name: bankops-web
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: cloudflared
      namespace: cloudflare-tunnel
